name: Build release artifacts
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions: {}
jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux-x86_64
          - runner: macos-26
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and package
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version"
          cargo test --locked
          cargo build --release --locked
          target/release/loto_random_cli --version
          name="loto_random_cli-$version-$PLATFORM"
          mkdir -p "dist/$name"
          install -m 755 target/release/loto_random_cli "dist/$name/loto_random_cli"
          install -m 644 README.md LICENSE "dist/$name"
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
