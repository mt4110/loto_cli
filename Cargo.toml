[package]
name = "loto_random_cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
description = "Loto 6/7 lottery number generator with a playful Oracle mode"
license = "MIT"
repository = "https://github.com/mt4110/loto_cli"

[dependencies]
time = { version = "0.3.55", features = ["macros", "parsing"] }
clap = { version = "4.6.9", features = ["derive"] }
getrandom = { version = "0.4.3", features = ["std"] }
